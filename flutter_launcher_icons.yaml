# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"

  android: "launcher_icon"
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0F0F1A"
    theme_color: "#0F0F1A"

  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/logo.png"
